aid: cesanta
name: Cesanta
description: >-
  Cesanta is an embedded software and IoT company, established in 2013 to develop and
  support the Mongoose embedded web server and networking library (HTTP, WebSocket, MQTT,
  CoAP, TCP/IP) that ships in over 100 million devices from vendors such as Siemens,
  Bosch, Samsung, Schneider Electric, Broadcom, Google, and Caterpillar — and even runs
  aboard the International Space Station. Alongside the Mongoose library, Cesanta builds
  Mongoose OS (an IoT firmware development framework for ESP32, ESP8266, STM32 and other
  microcontrollers with AWS/Azure/Google Cloud integration), VCON.io (remote firmware
  update and automated firmware testing), and mDash — a managed IoT device cloud offering
  device management, over-the-air (OTA) updates, a device database/shadow, remote RPC,
  access control, and a documented REST API for programmatic fleet management.
